# Explicit local-only mail sandbox. Never use this overlay on a public server.
services:
  backend:
    environment:
      MAIL_ENABLED: 'true'
      MAIL_FROM: noreply@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_SSL: 'false'
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    environment:
      MP_MAX_MESSAGES: 100
